# iridium-1-flagship — proposed experiment configuration, not a product.
# Parameter counts are verified by tests/unit/test_inventory.py.
name: iridium-1-flagship
transformer:
  d_model: 32768
  n_prelude: 4
  n_core: 80
  n_coda: 4
  d_ff: 90112
  n_query_heads: 256
  n_kv_heads: 32
  d_head: 128
  transformer_params: 992137445376
recurrence:
  policy: fixed          # fixed depth first; adaptive only after §4.4 gates pass
  depth: 2
  max_recurrence: 8
cache:
  key: [weight_version, workspace, prefix_revision, layer, recurrence, mask_version, codec_version]
  reference: uncached_recompute
  parity_tolerance: {rtol: 1.0e-5, atol: 1.0e-5, reference_dtype: float32}
generation:
  continuous_objective: conditional_flow_matching
  flow_steps: measured          # never a fixed promise; see §5.1
evidence:
  default_level: illustrative   # raised only by verifier records
# Research target only. §16.2: a fully retained 1,048,576-token stream needs
# 1.375 TiB of KV at R=1 and 5.125 TiB at R=4. Advance here only after the
# pilot's scaling curves justify it and the runtime serves a mixed workload.
