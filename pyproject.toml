[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iridium"
version = "1.0.0"
description = "Iridium-1: a routed omnimodal model family, with presets sized for free-tier training."
readme = "README.md"
requires-python = ">=3.10"
# Private and proprietary: all rights reserved. There is deliberately no
# licence field and no LICENSE file. The classifier below makes PyPI refuse
# an accidental upload.
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.4",
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
# Streaming licensed text and training the subword tokenizer.
data = ["datasets>=2.18", "huggingface_hub>=0.23", "tokenizers>=0.15"]
# Colab / Kaggle TPU path.
tpu = ["torch_xla"]
dev = ["pytest>=8"]

[project.scripts]
iridium = "iridium.cli:main"

[tool.setuptools.packages.find]
include = ["iridium*"]
